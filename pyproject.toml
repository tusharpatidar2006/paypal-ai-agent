[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "cleanroom"
version = "0.1.0"
description = "Trust layer for AI shopping agents against hostile merchant content"
readme = "README.md"
requires-python = ">=3.11"
license = {text = "Apache-2.0"}
authors = [
    {name = "Clean Room Contributors"}
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
]

dependencies = [
    "fastapi==0.115.0",
    "uvicorn[standard]==0.31.0",
    "httpx==0.27.2",
    "pydantic==2.9.2",
    "pydantic-settings==2.5.2",
    "cryptography==43.0.1",
    "numpy==2.1.2",
    "scikit-learn==1.5.2",
    "beautifulsoup4==4.12.3",
    "lxml==5.3.0",
    "tinycss2==1.3.0",
    "jinja2==3.1.4",
    "sse-starlette==2.1.3",
    "python-dotenv==1.0.1",
]

[project.optional-dependencies]
full = [
    "playwright==1.48.0",
    "onnxruntime==1.19.2",
    "tokenizers==0.20.1",
    "huggingface-hub==0.25.1",
    "fastembed==0.3.6",
    "pytesseract==0.3.13",
    "Pillow==10.4.0",
]
dev = [
    "pytest==8.3.3",
    "pytest-asyncio==0.24.0",
    "hypothesis==6.115.2",
    "ruff==0.6.9",
    "mypy==1.11.2",
    "matplotlib==3.9.2",
]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "N", "UP", "ANN", "B", "A", "C4", "DTZ", "T10", "ISC", "ICN", "PIE", "PT", "RET", "SIM", "ARG", "PTH", "PD", "PGH", "PL", "TRY", "NPY", "RUF"]
ignore = ["ANN101", "ANN102", "ANN401"]

[tool.mypy]
python_version = "3.11"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
asyncio_mode = "auto"
